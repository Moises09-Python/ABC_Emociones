    <center>
        <h1 class="titulo-relieve">Actividades</h1><br><br><br><br>
        <div class="flip-fila">
            <label class="flip">
                <input type="checkbox">
                <div class="flip-inner">
                    <div class="flip-frente" style="background-image: url('img/b1.jpg');">
                        <span class="flip-titulo">Reconoce lo que sientes sobre tu entorno</span>
                    </div>
                    <div class="flip-reverso">No ignores lo que te preocupa o incomoda de tu escuela, comunidad o redes. Ponle nombre a esa emoción (enojo, tristeza, esperanza, inquietud) para entender qué te importa y qué necesita atención.</div>
                </div>
            </label>
        </div><br><br><br><br>
        <div class="flip-fila">
            <label class="flip">
                <input type="checkbox">
                <div class="flip-inner">
                    <div class="flip-frente" style="background-image: url('img/b2.jpg');">
                        <span class="flip-titulo">Cuestiona la idea de que nada puede cambiar</span>
                    </div>
                    <div class="flip-reverso">Pensar que nada puede hacerse aumenta el malestar y la soledad. Habla y escucha a otras personas de confianza para abrir nuevas ideas y posibilidades de cambio.</div>
                </div>
            </label>
            <label class="flip">
                <input type="checkbox">
                <div class="flip-inner">
                    <div class="flip-frente" style="background-image: url('img/b3.jpg');">
                        <span class="flip-titulo">Enfócate en lo que sí puedes hacer</span>
                    </div>
                    <div class="flip-reverso">No tienes que resolverlo todo de golpe. Elige pequeñas acciones cotidianas en tu casa, grupo escolar o barrio: cada paso suma y tiene efectos reales.</div>
                </div>
            </label>
        </div><br><br><br><br>
        <div class="flip-fila">
            <label class="flip">
                <input type="checkbox">
                <div class="flip-inner">
                    <div class="flip-frente" style="background-image: url('img/b4.jpg');">
                        <span class="flip-titulo">Dale sentido a lo que haces en comunidad</span>
                    </div>
                    <div class="flip-reverso">Recuerda que no estás solo y que formas parte de grupos donde tu aporte cuenta. Organízate con otras personas y propón acuerdos para mejorar la convivencia y el bienestar común.</div>
                </div>
            </label>
            <label class="flip">
                <input type="checkbox">
                <div class="flip-inner">
                    <div class="flip-frente" style="background-image: url('img/b5.jpg');">
                        <span class="flip-titulo">Piensa, pregunta y dialoga en conjunto</span>
                    </div>
                    <div class="flip-reverso">Pregunta para entender mejor las situaciones y dialoga sin juzgar para descubrir coincidencias y distintos puntos de vista. Resolver cosas en conjunto reduce la soledad y motiva ideas nuevas.</div>
                </div>
            </label>
            <label class="flip">
                <input type="checkbox">
                <div class="flip-inner">
                    <div class="flip-frente" style="background-image: url('img/b6.jpg');">
                        <span class="flip-titulo">Cuida la convivencia, la naturaleza y el diálogo</span>
                    </div>
                    <div class="flip-reverso">Cuida el agua, las plantas, los animales y los espacios que compartes. Practica la escucha, la inclusión y la resolución pacífica de conflictos (aprender, reparar y restaurar cuando sea seguro).</div>
                </div>
            </label>
        </div><br><br>
    </center>
