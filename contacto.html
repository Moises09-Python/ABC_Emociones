<body>
    <div class="fondo fondo-2"></div>
    <header class="nav nav-cristal">
        <a class="nav-logo" href="index.html">ABC de las Emociones</a>
        <nav class="nav-links">

    </header>
    <br><br><form class="form-vidrio form-azul" onsubmit="event.preventDefault(); window.location.href = 'contacto.html';">
        <h2>Deja tu mensaje</h2>
        <p>Ingresa tus Datos</p>
        <div class="form-campo">
            <label for="1">Nombre</label>
            <input type="text" id="1" name="1" placeholder="Tu nombre" required>
        </div>
        <div class="form-campo">
            <label for="2">Edad</label>
            <input type="number" id="2" name="2" placeholder="Tu edad" required>
        </div>
        <div class="form-campo">
            <label for="3">Numero de Celular</label>
            <input type="tel" id="3" name="3" placeholder="Tu número de celular" required>
        </div>
        <div class="form-campo">
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" required></textarea>
        </div>
        <button class="form-boton" type="submit">Enviar</button>
    </form>
</body>
